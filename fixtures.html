      } catch (e) {}
    </script>

  <body class="page-template" data-page="fixtures">
    <header class="top js-header">
      <a class="logo" href="index.html" data-help="chrome.logo">
        <img src="assets/images/Ierne-logo-768x920.png" alt="Ierne Tennis home" width="768" height="920">
      </a>
      <button type="button" class="help-toggle" data-help-toggle aria-pressed="false" aria-label="Help: tap, then tap a control" title="Help">?</button>
      <nav class="navbar js-navbar">
        <button class="navbar__toggle js-toggle" data-help="chrome.menu" aria-label="Menu" aria-haspopup="true" aria-expanded="false">
          <span class="navbar__toggle-box">
            <span class="navbar__toggle-inner">Menu</span>
          </span>
        </button>
        <ul class="navbar__menu">
          <li><a data-help="chrome.navHome" href="index.html" target="_self">Home</a></li>
          <li class="nav-item-standings"><a data-help="chrome.navStandings" href="standings.html" target="_self">Standings</a></li>
          <li class="nav-item-ladder" hidden aria-hidden="true"><a data-help="chrome.navLadder" href="ladder.html" target="_self">Ladder</a></li>
          <li><a data-help="chrome.navFixtures" href="fixtures.html" target="_self">Fixtures</a></li>
          <li><a data-help="chrome.navResults" href="results.html" target="_self">Results</a></li>
          <li><a data-help="chrome.navRules" href="rules.html" target="_self">Rules</a></li>
          <li class="nav-account-signed-out"><button type="button" class="nav-account-connect" data-help="chrome.connect">Connect</button></li>
          <li class="nav-account-signed-in" hidden><span class="nav-account-who" data-help="chrome.account"></span></li>
          <li class="nav-account-signed-in" hidden><button type="button" class="nav-account-signout" data-help="chrome.signOut">Sign out</button></li>
          <li><button type="button" class="nav-admin-toggle" data-help="chrome.adminToggle" id="nav-admin-mode-toggle">Unlock Admin Mode</button></li>
          <li class="nav-admin-only nav-admin-break" hidden aria-hidden="true"></li>
          <li class="nav-admin-only" hidden aria-hidden="true"><a data-help="chrome.navManageComps" href="admin-competitions.html" target="_self">Manage Comps</a></li>
          <li class="nav-admin-only" hidden aria-hidden="true"><a data-help="chrome.navManagePlayers" href="admin-players.html" target="_self">Manage Players</a></li>
          <li class="nav-admin-only" hidden aria-hidden="true"><a data-help="chrome.navManageFixtures" href="admin-fixtures.html" target="_self">Manage Fixtures</a></li>
          <li class="nav-admin-only" hidden aria-hidden="true"><a data-help="chrome.navAccounts" href="admin-accounts.html" target="_self">Accounts</a></li>
        </ul>
      </nav>
    </header>
    <main class="page">
      <article class="content">
        <div class="hero">
          <header class="hero__content hero__content--centered">
            <div class="wrapper"><h1>Fixtures</h1></div>
          </header>
          <figure class="hero__image">
            <div class="hero__image-wrapper">
              <img src="assets/images/court-hero.svg" loading="eager" height="816" width="1456" alt="A tennis court seen from above" />
            </div>
          </figure>
        </div>
        <div class="entry-wrapper content__entry">
          <p id="page-competition-name" class="align-center" data-help="chrome.compName"></p>
          <div id="filter-container" class="league-filter" hidden aria-label="Filter by group" data-help="chrome.groupFilter"></div>
          <div id="fixtures-list" class="fixtures-list" data-help="fixtures.match"></div>
          <dialog id="fixture-result-dialog" class="fixture-result-dialog" aria-labelledby="fixture-result-title" data-help="result.dialog">
            <button type="button" class="help-toggle help-toggle--corner" data-help-toggle aria-pressed="false" aria-label="Help: tap, then tap a control" title="Help">?</button>
            <form id="fixture-result-form" class="fixture-result-form">
              <button type="button" id="fixture-result-approve" class="fixture-result-approve" hidden data-help="result.approve">Approve</button>
              <h2 id="fixture-result-title" class="fixture-result-dialog__heading">Enter result</h2>
              <p id="fixture-result-entered-by" class="fixture-result-entered-by" hidden></p>
              <p id="fixture-result-approved-by" class="fixture-result-entered-by fixture-result-approved-by" hidden></p>
              <input type="hidden" id="fixture-result-fixture-id" />
              <p class="fixture-result-date-row">
                <label for="fixture-result-date">Match date</label>
                <span class="fixture-result-date-controls">
                  <input type="text" id="fixture-result-date" required placeholder="31 Jan 2026" inputmode="text" autocomplete="off" spellcheck="false" data-help="result.date" />
                  <input type="date" id="fixture-result-date-picker" class="fixture-result-date-picker" aria-label="Choose match date" data-help="result.datePicker" />
                </span>
              </p>
              <p id="fixture-result-format" class="fixture-result-format" data-help="result.format"></p>
              <div class="tennis-score" data-help="result.sets">
                <div class="tennis-score__head">
                  <span></span>
                  <div id="fixture-result-label-a" class="fixture-result-player-name"></div>
                  <div id="fixture-result-label-b" class="fixture-result-player-name"></div>
                </div>
                <div id="tennis-score-sets"></div>
                <p id="tennis-score-line" class="tennis-score__line" aria-live="polite"></p>
              </div>
              <p class="fixture-result-clear-row">
                <button type="button" id="fixture-result-clear" class="fixture-result-clear" hidden data-help="result.clear">Clear this result</button>
              </p>
              <p id="fixture-result-msg" class="msg" hidden></p>
              <div class="fixture-result-actions">
                <button type="submit" class="btn fixture-result-btn fixture-result-btn--save" id="fixture-result-save" data-help="result.save"><span class="fixture-result-btn__text">Save</span></button>
                <button type="button" id="fixture-result-slip-btn" class="result-slip-btn" aria-label="Score card photo" data-help="result.slip"></button>
                <button type="button" class="btn fixture-result-btn fixture-result-btn--cancel" id="fixture-result-cancel" data-help="result.cancel"><span class="fixture-result-btn__text">Cancel</span></button>
              </div>
            </form>
          </dialog>
        </div>
      </article>
    </main>
    <footer class="footer">
      <div class="wrapper">
        <nav class="footer__nav">
          <ul>
            <li><a data-help="chrome.navStandings" href="standings.html" class="al footer-standings-link" target="_self">Standings</a></li>
            <li hidden><a data-help="chrome.navLadder" href="ladder.html" class="al footer-ladder-link" target="_self">Ladder</a></li>
            <li><a data-help="chrome.navFixtures" href="fixtures.html" class="al" target="_self">Fixtures</a></li>
            <li><a data-help="chrome.navResults" href="results.html" class="al" target="_self">Results</a></li>
          </ul>
        </nav>
        <div class="footer__copyright">
          <p>Created by <button type="button" class="jp-logo" style="--jp-logo-color: var(--color)" data-help="chrome.credit" aria-label="JP logo: tap to replay its animation"><img src="assets/icons/jpLogo-white-rotated-2000.png" alt="JP" width="37" height="22"></button></p>
        </div>
        <button id="backToTop" class="footer__bttop" aria-label="Back to top" title="Back to top" data-help="chrome.backToTop">
          <svg width="20" height="20" viewBox="0 0 24 24">
            <path d="M8 6L12 2L16 6" fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" />
            <path d="M12 2V22" fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" />
          </svg>
        </button>
      </div>
    </footer>
    <script defer src="assets/js/scripts.min.js"></script>
    <script>
      window.themeMenuConfig = {
        mobileMenuMode: "overlay",
        animationSpeed: 300,
        submenuWidth: "auto",
        doubleClickTime: 500,
        mobileMenuExpandableSubmenus: true,
        relatedContainerForOverlayMenuSelector: ".top",
      };
    </script>
    <script src="assets/js/utils/nav-active.js"></script>
    <script src="assets/js/components/jp-logo.js"></script>

</html>
